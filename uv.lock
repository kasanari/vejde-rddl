[[package]]
name = "vejde-rddl"
version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "gymnasium" },
    { name = "pyrddlgym" },
    { name = "rddlrepository" },
]

[package.optional-dependencies]
cpu = [
    { name = "regawa", marker = "extra == 'extra-10-vejde-rddl-cpu' or (extra == 'extra-10-vejde-rddl-cu124' and extra == 'extra-6-regawa-cpu')" },
    { name = "regawa", extra = ["cpu"], marker = "(extra == 'extra-10-vejde-rddl-cpu' and extra == 'extra-10-vejde-rddl-cu124') or (extra == 'extra-10-vejde-rddl-cpu' and extra == 'extra-6-regawa-cpu') or (extra == 'extra-10-vejde-rddl-cpu' and extra == 'extra-6-regawa-cu124') or (extra == 'extra-10-vejde-rddl-cu124' and extra == 'extra-6-regawa-cpu')" },
]
cu124 = [
    { name = "regawa", marker = "extra == 'extra-10-vejde-rddl-cu124' or (extra == 'extra-10-vejde-rddl-cpu' and extra == 'extra-6-regawa-cu124')" },
    { name = "regawa", extra = ["cu124"], marker = "(extra == 'extra-10-vejde-rddl-cpu' and extra == 'extra-10-vejde-rddl-cu124') or (extra == 'extra-10-vejde-rddl-cpu' and extra == 'extra-6-regawa-cu124') or (extra == 'extra-10-vejde-rddl-cu124' and extra == 'extra-6-regawa-cpu') or (extra == 'extra-10-vejde-rddl-cu124' and extra == 'extra-6-regawa-cu124')" },
]

[package.dev-dependencies]
dev = [
    { name = "graphviz" },
    { name = "matplotlib" },
    { name = "pytest" },
]

[package.metadata]
requires-dist = [
    { name = "gymnasium", specifier = ">=1.1.1" },
    { name = "pyrddlgym", specifier = ">=2.2" },
    { name = "rddlrepository", specifier = ">=2.0" },
    { name = "regawa", extras = ["cpu"], marker = "extra == 'cpu'", git = "ssh://git@gitr.sys.kth.se/jaknyb/RDDLGraphWrapper?branch=main" },
    { name = "regawa", extras = ["cu124"], marker = "extra == 'cu124'", git = "ssh://git@gitr.sys.kth.se/jaknyb/RDDLGraphWrapper?branch=main" },
]
provides-extras = ["cpu", "cu124"]

[package.metadata.requires-dev]
dev = [
    { name = "graphviz", specifier = ">=0.20.3" },
    { name = "matplotlib", specifier = ">=3.10.1" },
    { name = "pytest", specifier = ">=8.3.5" },
]
